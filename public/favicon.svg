<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" fill="#1e1c1a"/>
  <!-- Left half: "GG" in warm white -->
  <rect x="0" y="0" width="16" height="32" fill="#1e1c1a"/>
  <!-- Right half: "XT" accent block -->
  <rect x="16" y="0" width="16" height="32" fill="#f0ede8"/>
  <!-- Letter G (left side) -->
  <text x="3" y="22" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#f0ede8">GG</text>
  <!-- Letter XT (right side) -->
  <text x="17" y="22" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#1e1c1a">XT</text>
</svg>
